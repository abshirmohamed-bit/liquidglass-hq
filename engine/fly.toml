# fly.toml app configuration file generated for crayzmundo-engine on 2026-10-17T03:17:31Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'crayzmundo-engine'
primary_region = 'syd'
kill_signal = 'SIGTERM'
kill_timeout = '5m0s'

[build]
  dockerfile = 'Dockerfile'

[env]
  DATA_DIR = '/data'
  HF_HOME = '/data/models'
  PORT = '8080'

[[mounts]]
  source = 'crayz_data'
  destination = '/data'
  initial_size = '10gb'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 40
    soft_limit = 20

[checks]
  [checks.health]
    port = 8080
    type = 'http'
    interval = '30s'
    timeout = '5s'
    grace_period = '40s'
    method = 'GET'
    path = '/v1/health'

[[vm]]
  size = 'performance-2x'
  memory = '4gb'
